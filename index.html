.tg{display:flex;flex-wrap:wrap;gap:5px}

.ck b{font-variant-numeric:tabular-nums;font-weight:600}
#cl{max-height:260px;overflow:auto}
.st{font-size:11px;color:var(--mu);line-height:1.6}
input{width:100%;box-sizing:border-box;background:#101c30;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px;font:inherit;margin:3px 0}
button.b{background:#101c30;color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:6px 10px;font:inherit;margin:2px 2px 2px 0}
#hud{position:absolute;left:10px;bottom:8px;color:#9fb4cf;font-size:11px;pointer-events:none;text-shadow:0 0 4px #000}
#say{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#0c1422dd;border:1px solid var(--ln);border-radius:14px;padding:5px 12px;display:none;max-width:60%;text-align:center}
#sel{position:absolute;right:10px;bottom:8px;background:#0c1422dd;border:1px solid var(--ln);border-radius:10px;padding:8px 10px;display:none;max-width:260px;line-height:1.5}
#cur{position:fixed;width:16px;height:16px;margin:-8px 0 0 -8px;border:2px solid #fff;border-radius:50%;display:none;pointer-events:none;z-index:5;box-shadow:0 0 6px #4cc9f0}
#tp{position:absolute;left:10px;top:10px;display:flex;gap:6px}
#tp button{width:38px;height:38px;border-radius:50%;background:#101c30cc;color:var(--tx);border:1px solid var(--ln);font-size:17px;padding:0}
#tp button.on{background:var(--ac);color:#04121c}
#rotm{display:none;position:fixed;inset:0;background:#05080ff0;z-index:9;align-items:center;justify-content:center;text-align:center;font-size:16px;padding:20px}
@media (orientation:portrait){#rotm{display:flex}}
