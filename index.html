<!DOCTYPE html>

<title>Earth Command</title>
<style>
:root{--bg:#05080f;--pn:#0c1422;--tx:#d7e3f4;--mu:#7f93ad;--ac:#4cc9f0;--ln:#1d2c44}

#app{display:flex;height:100%}
#stage{flex:1;position:relative;min-width:0}
canvas{width:100%;height:100%;display:block;touch-action:none}
#side{width:225px;background:var(--pn);border-left:1px solid var(--ln);overflow-y:auto;padding:8px 10px;box-sizing:border-box;flex:none;touch-action:pan-y}
#side.hide{display:none}
h3{margin:10px 0 5px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.tg{display:flex;flex-wrap:wrap;gap:5px}
.chip{background:#101c30;color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:5px 10px;font-size:12px;cursor:pointer}
.chip.on{background:var(--ac);color:#04121c;border-color:var(--ac)}
.ck{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px solid var(--ln);cursor:pointer}
.ck b{font-variant-numeric:tabular-nums;font-weight:600}
#cl{max-height:170px;overflow:auto}
input,textarea{width:100%;box-sizing:border-box;background:#101c30;color:var(--tx);border:1px solid var(--ln);border-radius:8px;padding:7px;font:inherit;margin:3px 0}
button.b{background:#101c30;color:var(--tx);border:1px solid var(--ln);border-radius:14px;padding:6px 10px;font:inherit;margin:2px 2px 2px 0}
a.lk{display:block;padding:6px 8px;margin:4px 0;background:#101c30;border:1px solid var(--ln);border-radius:8px;color:var(--tx);text-decoration:none}
a.lk small{display:block;color:var(--mu);font-size:10px}
#hud{position:absolute;left:10px;bottom:8px;color:#9fb4cf;font-size:11px;pointer-events:none;text-shadow:0 0 4px #000;line-height:1.5}
#say{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#0c1422cc;border:1px solid var(--ln);border-radius:14px;padding:5px 12px;display:none;max-width:60%}
#tp{position:absolute;left:10px;top:10px;display:flex;gap:6px}
#tp button{width:38px;height:38px;border-radius:50%;background:#101c30cc;color:var(--tx);border:1px solid var(--ln);font-size:17px;padding:0}
#tp button.on{background:var(--ac);color:#04121c}
#rotm{display:none;position:fixed;inset:0;background:#05080ff0;z-index:9;align-items:center;justify-content:center;text-align:center;font-size:16px;padding:20px}
@media (orientation:portrait){#rotm{display:flex}}
